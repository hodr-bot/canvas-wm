[package]
name = "canvas-wm"
version = "0.1.0"
edition = "2021"
description = "Infinite canvas Wayland compositor (floating only, game-feel camera)"
license = "GPL-3.0-or-later"

[[bin]]
name = "canvas-wm"
path = "src/main.rs"

[dependencies]
smithay = { version = "0.3", optional = true }
wayland-client = { version = "0.29", optional = true }
wayland-protocols = { version = "0.29", features = ["client"], optional = true }
xkbcommon = { version = "0.4", optional = true }
slog = { version = "2", optional = true }
log = "0.4"
env_logger = "0.10"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[features]
default = []
compositor = ["smithay", "wayland-client", "wayland-protocols", "xkbcommon", "slog"]

[dev-dependencies]
approx = "0.5"
libc = "0.2"
wayland-client = "0.29"
wayland-protocols = { version = "0.29", features = ["client"] }
